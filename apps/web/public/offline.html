<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Çevrimdışısın — Hemdem</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #18181b;
        --muted: #71717a;
        --primary: #e11d48;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f12;
          --fg: #f5f5f5;
          --muted: #a1a1aa;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: var(--muted);
      }
      button {
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--primary);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
      }
      .brand {
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .brand span {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="brand">Hemdem<span>.</span></div>
    <h1>İnternet bağlantın yok</h1>
    <p>
      Hemdem'i kullanmak için bir bağlantıya ihtiyacın var. Bağlantın geri geldiğinde tekrar dene.
    </p>
    <button type="button" onclick="location.reload()">Tekrar dene</button>
  </body>
</html>
